[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# The site moved to Cloudflare Pages at houseandhabit.blog on 5 Nov 2026.
# This Netlify copy now only redirects old links (old pins, Medium posts) to the new address.
[[redirects]]
  from = "/*"
  to = "https://houseandhabit.blog/:splat"
  status = 301
  force = true
